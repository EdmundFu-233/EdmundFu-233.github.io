<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Zhihao Fu — Portfolio</title>
  <desc id="description">York University student and software developer based in Toronto.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090f"/>
      <stop offset="0.55" stop-color="#11111d"/>
      <stop offset="1" stop-color="#15102a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c63ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6c63ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8b83ff" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1030" cy="80" r="370" fill="url(#glow)"/>
  <circle cx="165" cy="650" r="340" fill="url(#glow)" opacity="0.48"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="88" y="102" fill="#e8e8f0" font-size="30" font-weight="700">&lt;Z<tspan fill="#8b83ff">F</tspan> /&gt;</text>

    <rect x="88" y="148" width="340" height="48" rx="24" fill="#6c63ff" fill-opacity="0.14" stroke="#8b83ff" stroke-opacity="0.5"/>
    <circle cx="118" cy="172" r="6" fill="#8b83ff"/>
    <text x="138" y="181" fill="#b6b1ff" font-size="21" font-weight="600">York University · Toronto</text>

    <text x="82" y="324" fill="#f2f2f8" font-size="94" font-weight="800" letter-spacing="-3">Zhihao Fu</text>
    <text x="88" y="378" fill="#a0a0b8" font-size="29" font-weight="500">Student &amp; software developer</text>
    <text x="88" y="430" fill="#a0a0b8" font-size="25">Backend systems · iOS &amp; networking · Open source</text>

